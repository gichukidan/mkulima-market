<section class="auth-shell" id="top">
  <div class="w auth-wrap">
    <div class="auth-card auth-panel">
      <p class="eyebrow">Mkulima Market</p>
      <h1>Log in or create your account</h1>
      <p class="muted">Join as a buyer, seller or transporter and manage your profile from one place.</p>

      <div class="role-grid" id="roleGrid">
        <button class="role-card" type="button" data-role="buyer" aria-pressed="false">
          <span class="role-icon">🛒</span>
          <span>Buyer</span>
        </button>
        <button class="role-card active" type="button" data-role="seller" aria-pressed="true">
          <span class="role-icon">🌾</span>
          <span>Seller</span>
        </button>
        <button class="role-card" type="button" data-role="transporter" aria-pressed="false">
          <span class="role-icon">🚚</span>
          <span>Transporter</span>
        </button>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="field-row">
          <label>
            <span>Full name</span>
            <input type="text" name="fullName" placeholder="e.g. Amina Wambui" required>
          </label>
        </div>
        <div class="field-row two-col">
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" required>
          </label>
          <label>
            <span>Phone</span>
            <input type="tel" name="phone" placeholder="0712 345 678" required>
          </label>
        </div>
        <div class="field-row">
          <label>
            <span>Password</span>
            <input type="password" name="password" placeholder="Create a password" required>
          </label>
        </div>
        <button class="btn primary" type="submit">Create account</button>
      </form>
    </div>

    <div class="auth-card login-panel">
      <p class="eyebrow alt">Welcome back</p>
      <h2>Log in</h2>
      <form id="loginForm" class="auth-form compact">
        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" placeholder="Enter your password" required>
        </label>
        <button class="btn dark" type="submit">Sign in</button>
      </form>
      <div class="mini-note">
        <strong>Why join?</strong>
        <ul>
          <li>Sell produce and manage listings</li>
          <li>Find buyers or transport routes</li>
          <li>Track your profile and marketplace activity</li>
        </ul>
      </div>
    </div>
  </div>
</section>
