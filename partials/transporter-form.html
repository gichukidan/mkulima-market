<section class="form-shell" id="top">
  <div class="w form-wrap">
    <div class="form-card">
      <span class="form-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span>
      <p class="eyebrow alt" id="tfEyebrow">Create route</p>
      <h1 id="tfTitle">Offer a transport route</h1>
      <p id="formStatus" role="status" aria-live="polite"></p>
      <form id="transporterForm" class="stack-form">
        <div class="two-col">
          <label>
            <span data-t="lName">Route name</span>
            <input type="text" name="routeName" data-p="pName" placeholder="Nakuru to Nairobi" required maxlength="100">
          </label>
          <label>
            <span data-t="lVehicle">Vehicle</span>
            <input type="text" name="vehicle" data-p="pVehicle" placeholder="Truck / van / pickup" required maxlength="60">
          </label>
        </div>
        <div class="two-col">
          <label>
            <span data-t="lOrigin">Origin</span>
            <input type="text" name="origin" list="townList" data-p="pOrigin" placeholder="Nakuru" required maxlength="80" autocomplete="off">
          </label>
          <label>
            <span data-t="lDest">Destination</span>
            <input type="text" name="destination" list="townList" data-p="pDest" placeholder="Nairobi" required maxlength="80" autocomplete="off">
          </label>
        </div>
        <datalist id="townList"></datalist>
        <small class="hint" data-t="hTown">Pick a town from the list to show your route on the map, or type any place.</small>
        <div class="two-col">
          <label>
            <span data-t="lCap">Capacity (kg)</span>
            <input type="number" name="capacityKg" min="1" step="0.1" placeholder="2500" inputmode="decimal">
          </label>
          <label>
            <span data-t="lRate">Rate (KSh per km)</span>
            <input type="number" name="rate" min="1" step="1" placeholder="120" required inputmode="numeric">
          </label>
        </div>
        <label>
          <span data-t="lDays">Service days</span>
          <input type="text" name="serviceDays" data-p="pDays" placeholder="Mon - Sat" maxlength="60">
        </label>
        <label>
          <span data-t="lDesc">Description</span>
          <textarea name="description" rows="4" data-p="pDesc" placeholder="Reliable farm-to-market transport for fresh produce and grains." maxlength="2000"></textarea>
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="tfSubmit" data-t="bSave">Save route</button>
          <a class="btn ghost" href="#/dashboard" data-t="bCancel">Cancel</a>
          <button class="btn danger" type="button" id="tfDelete" hidden data-t="bDelete">Delete route</button>
        </div>
      </form>
    </div>
  </div>
</section>
