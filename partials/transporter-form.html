<section class="form-shell" id="top">
  <div class="w form-wrap">
    <div class="form-card">
      <span class="form-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span>
      <p class="eyebrow alt" id="tfEyebrow">Create route</p>
      <h1 id="tfTitle">Offer a transport route</h1>
      <p id="formStatus" role="status" aria-live="polite"></p>
      <form id="transporterForm" class="stack-form">
        <div class="two-col">
          <label>
            <span>Route name</span>
            <input type="text" name="routeName" placeholder="Nakuru to Nairobi" required>
          </label>
          <label>
            <span>Vehicle</span>
            <input type="text" name="vehicle" placeholder="Truck / van / pickup" required>
          </label>
        </div>
        <div class="two-col">
          <label>
            <span>Origin</span>
            <input type="text" name="origin" placeholder="Nakuru" required>
          </label>
          <label>
            <span>Destination</span>
            <input type="text" name="destination" placeholder="Nairobi" required>
          </label>
        </div>
        <div class="two-col">
          <label>
            <span>Capacity (kg)</span>
            <input type="number" name="capacityKg" min="1" step="0.1" placeholder="2500">
          </label>
          <label>
            <span>Rate (KSh per km)</span>
            <input type="number" name="rate" min="1" step="1" placeholder="120" required>
          </label>
        </div>
        <label>
          <span>Service days</span>
          <input type="text" name="serviceDays" placeholder="Mon - Sat">
        </label>
        <label>
          <span>Description</span>
          <textarea name="description" rows="4" placeholder="Reliable farm-to-market transport for fresh produce and grains."></textarea>
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="tfSubmit">Save route</button>
          <a class="btn ghost" href="#/dashboard">Cancel</a>
          <button class="btn danger" type="button" id="tfDelete" hidden>Delete route</button>
        </div>
      </form>
    </div>
  </div>
</section>
