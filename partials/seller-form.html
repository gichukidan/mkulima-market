<section class="form-shell" id="top">
  <div class="w form-wrap">
    <div class="form-card">
      <span class="form-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg></span>
      <p class="eyebrow" id="sfEyebrow">Create listing</p>
      <h1 id="sfTitle">Post a fresh produce listing</h1>
      <p id="formStatus" role="status" aria-live="polite"></p>
      <form id="sellerForm" class="stack-form">
        <div class="two-col">
          <label>
            <span>Listing title</span>
            <input type="text" name="title" placeholder="Tomato crates" required>
          </label>
          <label>
            <span>Commodity</span>
            <input type="text" name="commodity" placeholder="Tomatoes" required>
          </label>
        </div>
        <div class="two-col">
          <label>
            <span>Grade</span>
            <input type="text" name="grade" placeholder="Grade A">
          </label>
          <label>
            <span>Packed in</span>
            <select name="unit">
              <option value="kg">kg</option>
              <option value="crate">crate</option>
              <option value="bag">bag</option>
              <option value="box">box</option>
            </select>
          </label>
        </div>
        <div class="two-col">
          <label>
            <span>Total quantity (kg)</span>
            <input type="number" name="quantityKg" min="1" step="0.1" placeholder="120" required>
          </label>
          <label>
            <span>Price per kg (KSh)</span>
            <input type="number" name="pricePerKg" min="1" step="0.1" placeholder="75" required>
          </label>
        </div>
        <div class="two-col">
          <label>
            <span>Location</span>
            <input type="text" name="location" placeholder="Nairobi, Kenya">
          </label>
          <label>
            <span>Status</span>
            <select name="status">
              <option value="available">Available</option>
              <option value="almost_out">Almost out</option>
              <option value="paused">Paused</option>
              <option value="sold">Sold</option>
            </select>
          </label>
        </div>
        <label>
          <span class="label-row">Description
            <button class="btn ai" type="button" id="autowriteBtn" title="Write the title and description from the details above"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg><span class="btn-label">Auto-write</span></button>
          </span>
          <textarea name="description" rows="4" placeholder="Freshly harvested produce, suitable for wholesale buyers. Or fill in the details above and press Auto-write."></textarea>
          <small class="hint">Auto-write uses only the details you entered. Check it before saving. Your draft is saved on this device as you type.</small>
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="sfSubmit">Save listing</button>
          <a class="btn ghost" href="#/dashboard">Cancel</a>
          <button class="btn danger" type="button" id="sfDelete" hidden>Delete listing</button>
        </div>
      </form>
    </div>
  </div>
</section>
