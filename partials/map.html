<header>
  <div class="w">
    <h1 data-t="h1"></h1>
    <p data-t="lead"></p>
    <div class="warn" data-t="warn"></div>
  </div>
</header>

<section>
  <div class="w">
    <h2 data-t="mapH"></h2>
    <div class="ctl">
      <button class="btn" id="gps" data-t="gps"></button>
      <select id="town" aria-label="Town"></select>
      <div class="chips" id="rad" role="group"></div>
    </div>
    <div class="err" id="gerr" role="status"></div>
    <div class="m" id="cur" style="margin-bottom:18px"></div>
    <div class="grid">
      <div class="mapw">
        <div id="leafletMap" class="leaflet-map" aria-hidden="true"></div>
        <svg class="map" id="map" viewBox="0 0 576 700" role="img" aria-label="Map" style="display:none"></svg>
        <div class="lg">
          <label><span><input type="checkbox" data-ly="m" checked><i class="k m1" data-t="mk"></i></span></label>
          <label><span><input type="checkbox" data-ly="s" checked><i class="k s1" data-t="sl"></i></span></label>
          <label><span><input type="checkbox" data-ly="t" checked><i class="k t1" data-t="tr"></i></span></label>
        </div>
        <small data-t="mapNote"></small>
      </div>
      <div>
        <div class="m" id="cnt" style="margin-bottom:12px;font-weight:700"></div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <div class="feature-strip">
      <div class="feature-box green">
        <strong>Nearby</strong>
        <span>Markets, sellers and produce around you</span>
      </div>
      <div class="feature-box orange">
        <strong>Distance</strong>
        <span>Search radius and straight-line travel checks</span>
      </div>
      <div class="feature-box blue">
        <strong>Transport</strong>
        <span>Match haulage to route and vehicle type</span>
      </div>
    </div>
  </div>
</section>

<section class="alt">
  <div class="w">
    <h2>Transporters</h2>
    <p class="m" style="max-width:40em;margin-top:12px">Search available transporters by name, route, vehicle type and distance from your location.</p>
    <div class="form">
      <label><span>Search</span><input type="search" id="transporterSearch" placeholder="Search transporter, vehicle or town"></label>
      <label><span>Vehicle</span><select id="vehicleFilter"><option value="">All vehicles</option><option value="Pickup">Pickup</option><option value="Truck">Truck</option><option value="Van">Van</option><option value="Tricycle">Tricycle</option></select></label>
    </div>
    <div class="res" id="transporterList"></div>
  </div>
</section>

<footer><div class="w" data-t="foot"></div></footer>
